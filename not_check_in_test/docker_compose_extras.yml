# Containers supplémentaires à intégrer dans le docker-compose principal
# Ces services sont en test et doivent être validés avant intégration.

services:

  # 🐳 Portainer — Gestion des containers en WebUI
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /app/portainer/config:/data
    ports:
      - 9000:9000
    networks:
      network_hub_multimedia:
        ipv4_address: 172.19.0.16

  # 🔄 Watchtower — Mise à jour automatique des images Docker
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      # Décommenter et renseigner pour activer les notifications Discord :
      # - WATCHTOWER_NOTIFICATION_URL=discord://token@channel_id
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /app/watchtower/config:/config

  # 📊 Uptime Kuma — Monitoring de disponibilité des services
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - /app/uptime-kuma/config:/app/data
    ports:
      - 3001:3001
    networks:
      network_hub_multimedia:
        ipv4_address: 172.19.0.17

  # 🎵 Lidarr — Gestion automatisée de la musique
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /app/lidarr/config:/config
      - /data:/data
      - /data2:/data2
      - ${MEDIA_DIR}/qbittorrent/downloads:/downloads
    ports:
      - 8686:8686
    networks:
      network_hub_multimedia:
        ipv4_address: 172.19.0.18

  # 📚 Readarr — Gestion automatisée des ebooks
  readarr:
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /app/readarr/config:/config
      - /data:/data
      - /data2:/data2
      - ${MEDIA_DIR}/qbittorrent/downloads:/downloads
    ports:
      - 8787:8787
    networks:
      network_hub_multimedia:
        ipv4_address: 172.19.0.19

  # ♻️ Recyclarr — Synchronisation des profils qualité TRaSH Guides
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - /app/recyclarr/config:/config
    networks:
      network_hub_multimedia:
        ipv4_address: 172.19.0.20
