# Healthchecks manquants à ajouter dans le docker-compose principal
# Ces blocs sont à copier dans les services concernés.

# === Plex ===
# Ajouter sous le service plex :
#    healthcheck:
#      test: curl -f http://localhost:32400/identity || exit 1
#      interval: 30s
#      timeout: 10s
#      start_period: 60s
#      retries: 3

